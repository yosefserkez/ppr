name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first, and six jobs per run is enough to stack up
# a queue nobody is reading by the time it drains.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` is `tsc`, so it already fails on any type error — a
      # separate `pnpm typecheck` step ran the same check twice and threw the
      # output away. The npm script stays, for local use.
      - run: pnpm build
      # The suite never reaches the network: providers are exercised against a
      # local stub server, and the vault against an in-memory store.
      - run: pnpm test
